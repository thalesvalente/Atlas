name: ATLAS003 Spec Kit contract checks

on:
  pull_request:
    paths:
      - 'specs/003-producer-selective-preview/**'
      - 'specs/004-atlas-parity-c0/**'
      - 'docs/missions/atlas-parity-03/c1-core-composition/**'
      - 'docs/missions/atlas-parity-04/**'
      - 'docs/architecture/ADR-0003-legacy-compatibility-proposed.md'
      - '.specify/**'
      - '.agents/skills/**'
      - '.github/workflows/atlas003-speckit.yml'
      - '.github/workflows/atlas-parity04-doc.yml'
      - 'packages/protocol/src/caderno_protocol/read_model.py'
      - 'packages/atlas/src/atlas_viewer/static/**'
      - 'packages/atlas/src/atlas_viewer/catalog.py'
      - 'packages/atlas/src/atlas_viewer/server.py'
      - 'scripts/qa/speckit_audit.py'
      - 'scripts/qa/atlas_parity04_doc_ci.py'
      - 'tests/qa/test_speckit_presentation_audit.py'
      - 'tests/qa/test_atlas_parity04_doc_ci.py'
      - 'tests/viewer/test_related_references.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atlas003-specification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate, with baseline history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record exact candidate
        run: git rev-parse HEAD
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install official Spec Kit pinned version
        run: python -m pip install specify-cli==1.2.3
      - name: Verify official CLI and Codex integration
        run: |
          specify version --json
          specify integration status --json
      - name: Check generated Spec Kit assets and preserved architecture
        shell: bash
        run: |
          if git merge-base --is-ancestor 04373bb910db2e6215cc8bc4212093b649e48456 HEAD; then
            python scripts/qa/atlas_parity04_f2_doc_ci.py speckit
          else
            ap04_ancestry_status=$?
            if [ "$ap04_ancestry_status" -ne 1 ]; then
              exit "$ap04_ancestry_status"
            fi
            python scripts/qa/atlas_parity04_doc_ci.py speckit
          fi
      - name: Verify feature 003 requirements and tasks without active-pointer writes
        env:
          SPECIFY_FEATURE_NO_PERSIST: '1'
          SPECIFY_FEATURE_DIRECTORY: specs/003-producer-selective-preview
        run: |
          python .specify/scripts/python/check_prerequisites.py --json --require-spec --require-tasks --include-tasks
          python .specify/scripts/python/resolve_template.py spec-template --json
      - name: Verify composed feature 004 without active-pointer writes
        env:
          SPECIFY_FEATURE_NO_PERSIST: '1'
          SPECIFY_FEATURE_DIRECTORY: specs/004-atlas-parity-c0
        run: |
          python .specify/scripts/python/check_prerequisites.py --json --require-spec --require-tasks --include-tasks
          python .specify/scripts/python/resolve_template.py spec-template --json
