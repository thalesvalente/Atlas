name: Atlas pending24 documentary oracles

on:
  pull_request:
    paths:
      - 'docs/missions/atlas-pending24-closure-20261108/**'
      - '.github/workflows/atlas-pending24-oracles.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentary:
    name: Documentary examples / ${{ matrix.os }} / optimize=${{ matrix.optimize }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        optimize: ['0', '1']
    env:
      PYTHONOPTIMIZE: ${{ matrix.optimize }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Record exact candidate
        run: git rev-parse HEAD
      - name: Verify five documentary examples and six negative controls
        run: python -B docs/missions/atlas-pending24-closure-20261108/verify_oracles.py
