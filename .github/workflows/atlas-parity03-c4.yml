name: ATLAS-PARITY-03 C4 full composition

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrated-browser:
    name: C4 installed C0+P03 / ${{ matrix.os }} / optimize=${{ matrix.optimize }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        optimize: ['0', '1']
    env:
      PYTHONUTF8: '1'
      PYTHONOPTIMIZE: ${{ matrix.optimize }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Exact C4 SHA with all input ancestry
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Bind input manifests, frozen fixtures, protocol and exact asset allowlist
        run: python scripts/qa/atlas_parity03_c4_ci.py inputs
      - name: Supply pinned engineering tools
        run: python -m pip install build==1.3.0 setuptools==80.9.0 wheel==0.45.1
      - name: Build and isolate SDK and viewer outside checkout
        run: python scripts/qa/clean_install.py --repo . --work "${{ runner.temp }}/atlas-c4-integrated"
      - name: Install pinned Playwright using the runner's existing Chromium
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
      - name: Exercise actual installed main application and package replacement
        run: python scripts/qa/atlas_parity03_c4_ci.py browser --work "${{ runner.temp }}/atlas-c4-integrated"
      - name: Preserve C4 SHA-bound JSON, JUnit and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-c4-integrated-${{ matrix.os }}-O${{ matrix.optimize }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .test-output/atlas-parity03-c4/**
            ${{ runner.temp }}/atlas-c4-integrated/clean-install-report.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  specification:
    name: C4 Spec Kit 1.2.3 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: '1'
      SPECIFY_FEATURE_NO_PERSIST: '1'
      SPECIFY_FEATURE_DIRECTORY: specs/004-atlas-parity-c0/workstreams/c4-full-convergence
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Create an isolated environment for the official pinned CLI
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/atlas-c4-specify"
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "$RUNNER_TEMP/atlas-c4-specify/Scripts" >> "$GITHUB_PATH"
          else
            echo "$RUNNER_TEMP/atlas-c4-specify/bin" >> "$GITHUB_PATH"
          fi
      - name: Install official CLI 1.2.3 inside its isolated environment
        run: python -m pip install specify-cli==1.2.3
      - name: Verify CLI, managed assets and strict C4 authorization
        run: |
          specify version --json
          specify integration status --json
          python scripts/qa/speckit_audit.py --allow-presentation-delta --allow-p03-c4-delta
      - name: Resolve C4 spec, plan and tasks without writing a shared pointer
        run: |
          python .specify/scripts/python/check_prerequisites.py --json --require-spec --require-tasks --include-tasks
          python .specify/scripts/python/resolve_template.py spec-template --json
          python scripts/qa/atlas_parity03_c4_ci.py inputs
      - name: Preserve exact-SHA specification binding
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-c4-specification-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: .test-output/atlas-parity03-c4/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

