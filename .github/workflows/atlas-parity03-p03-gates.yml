name: ATLAS-PARITY03 P03 isolated qualification

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: P03 portable / ${{ matrix.os }} / optimize=${{ matrix.optimize }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        optimize: ['0', '1']
    env:
      PYTHONOPTIMIZE: ${{ matrix.optimize }}
      PYTHONUTF8: '1'
      P03_JOB_KIND: portable
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Supply pinned test-only build and JSON Schema tooling
        run: python -m pip install -r scripts/qa/atlas_parity03_p03_requirements.txt
      - name: Install SDK and viewer for focal collection
        run: python -m pip install --no-build-isolation --no-deps ./packages/protocol ./packages/atlas
      - name: Bind frozen inputs and ownership to exact candidate
        run: python ${{ (github.head_ref == 'integrate/atlas-parity03-c4-full-candidate-20261027' || github.ref_name == 'integrate/atlas-parity03-c4-full-candidate-20261027') && 'scripts/qa/atlas_parity03_c4_ci.py' || 'scripts/qa/atlas_parity03_p03_ci.py' }} inputs --output-dir .test-output/atlas-parity03-p03
      - name: Collect SDK and P03 tests with zero skips
        run: python scripts/qa/atlas_parity03_p03_ci.py tests
      - name: Build with setuptools 80.9.0 and install outside checkout
        run: python scripts/qa/atlas_parity03_p03_ci.py build
      - name: Exercise isolated harness over real loopback HTTP
        run: python scripts/qa/atlas_parity03_p03_ci.py http
      - name: Require all portable receipts for this exact SHA
        if: always()
        run: python scripts/qa/atlas_parity03_p03_ci.py summary
      - name: Preserve portable receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p03-portable-${{ matrix.os }}-O${{ matrix.optimize }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: .test-output/atlas-parity03-p03/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  browser:
    name: P03 Chromium / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: '1'
      P03_JOB_KIND: browser
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install pinned test driver without downloading Chromium
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
      - name: Bind frozen inputs and ownership to exact candidate
        run: python ${{ (github.head_ref == 'integrate/atlas-parity03-c4-full-candidate-20261027' || github.ref_name == 'integrate/atlas-parity03-c4-full-candidate-20261027') && 'scripts/qa/atlas_parity03_c4_ci.py' || 'scripts/qa/atlas_parity03_p03_ci.py' }} inputs --output-dir .test-output/atlas-parity03-p03
      - name: Exercise P03 in existing runner Chromium
        run: python scripts/qa/atlas_parity03_p03_ci.py browser
      - name: Require browser receipts for this exact SHA
        if: always()
        run: python scripts/qa/atlas_parity03_p03_ci.py summary
      - name: Preserve browser receipts and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p03-browser-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: .test-output/atlas-parity03-p03/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  specification:
    name: P03 Spec Kit 1.2.3 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: '1'
      SPECIFY_FEATURE_NO_PERSIST: '1'
      SPECIFY_FEATURE_DIRECTORY: specs/004-atlas-parity-c0/workstreams/p03-components/c2-qualification
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install official pinned Spec Kit CLI
        run: python -m pip install specify-cli==1.2.3
      - name: Verify CLI and Codex integration
        run: |
          specify version --json
          specify integration status --json
      - name: Check C2 workstream without shared-pointer writes
        run: |
          python .specify/scripts/python/check_prerequisites.py --json --require-spec --require-tasks --include-tasks
          python .specify/scripts/python/resolve_template.py spec-template --json
          python ${{ (github.head_ref == 'integrate/atlas-parity03-c4-full-candidate-20261027' || github.ref_name == 'integrate/atlas-parity03-c4-full-candidate-20261027') && 'scripts/qa/atlas_parity03_c4_ci.py' || 'scripts/qa/atlas_parity03_p03_ci.py' }} inputs --output-dir .test-output/atlas-parity03-p03
      - name: Preserve specification input evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p03-specification-${{ matrix.os }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: .test-output/atlas-parity03-p03/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
