name: AP04 F4 C2 external reader synthetic qualification

on:
  pull_request:
    branches: [docs/atlas-parity04-f2-legacy-contract-20261030]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-f4-c2-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  synthetic-reader:
    name: F4 C2 / ${{ matrix.os }} / optimize=${{ matrix.optimize }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        optimize: ['0', '1']
    env:
      PYTHONUTF8: '1'
      PYTHONOPTIMIZE: ${{ matrix.optimize }}
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Checkout exact mission SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned public engineering dependencies
        run: python -m pip install pytest==8.4.2 jsonschema==4.25.1 setuptools==80.9.0 wheel==0.45.1
      - name: Synthetic counterproofs with JUnit
        run: python -m pytest tests/qa/test_atlas_parity04_f4_c2_reader.py tests/qa/test_atlas_parity04_f4_c2_real_v5.py -v --junitxml=.test-output/atlas-parity04-f4-c2/junit.xml
      - name: Build and execute public wheels without the external tool
        if: always()
        run: python scripts/qa/atlas_parity04_f4_c2_qualification.py --output .test-output/atlas-parity04-f4-c2/independence.json
      - name: Publish exact SHA evidence summary
        if: always()
        run: python scripts/qa/atlas_parity04_f4_c2_evidence.py
      - name: Preserve synthetic JSON and JUnit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-f4-c2-${{ matrix.os }}-O${{ matrix.optimize }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: .test-output/atlas-parity04-f4-c2/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
