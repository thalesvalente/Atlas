name: ATLAS021 candidate verification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: ${{ matrix.os }} / Python optimize=${{ matrix.optimize }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        optimize: ['0', '1']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONOPTIMIZE: ${{ matrix.optimize }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Record exact candidate
        run: git rev-parse HEAD
      - name: Install pinned build and validation tools
        run: python -m pip install build==1.3.0 setuptools==80.9.0 wheel==0.45.1 jsonschema==4.25.1
      - name: Install separate protocol and viewer packages
        run: python -m pip install --no-build-isolation ./packages/protocol ./packages/atlas
      - name: Verify contracts, architecture, safe reading and viewer
        run: python scripts/run_checks.py
      - name: Install wheels again in new empty environments
        run: python scripts/qa/clean_install.py --repo . --work "${{ runner.temp }}/atlas-c1-portable"
      - name: Install test-only schema tooling and run the installed suite outside checkout with zero skips
        shell: bash
        run: |
          if git merge-base --is-ancestor 04373bb910db2e6215cc8bc4212093b649e48456 HEAD; then
            python scripts/qa/atlas_parity04_f2_doc_ci.py installed --repo . --work "${{ runner.temp }}/atlas-c1-portable" --install-test-tools
          else
            ap04_ancestry_status=$?
            if [ "$ap04_ancestry_status" -ne 1 ]; then
              exit "$ap04_ancestry_status"
            fi
            python scripts/qa/atlas_parity04_doc_ci.py installed --repo . --work "${{ runner.temp }}/atlas-c1-portable" --install-test-tools
          fi
      - name: Verify installed wheel assets and fixed routes
        run: python scripts/qa/atlas_parity02_p06_wheel.py --work "${{ runner.temp }}/atlas-c1-portable"
      - name: Preserve exact-SHA installed verification receipts and collection
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-c1-installed-${{ matrix.os }}-O${{ matrix.optimize }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/atlas-c1-portable/clean-install-report.json
            ${{ runner.temp }}/atlas-c1-portable/parity02-p06-installed-checks.json
            ${{ runner.temp }}/atlas-c1-portable/parity02-p06-installed-checks.log
            ${{ runner.temp }}/atlas-c1-portable/parity02-p06-wheel-report.json
            ${{ runner.temp }}/atlas-c1-portable/c4-installed-receipt.json
            ${{ runner.temp }}/atlas-c1-portable/c4-installed-junit.xml
          if-no-files-found: error
          retention-days: 14

  browser:
    name: Installed viewer / Chromium desktop and mobile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Build and install in isolated environments
        run: |
          git rev-parse HEAD
          python -m pip install build==1.3.0 setuptools==80.9.0 wheel==0.45.1
          python scripts/qa/clean_install.py --repo . --work "$RUNNER_TEMP/atlas-c1-browser"
      - name: Install pinned browser test tooling
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Exercise installed product in a real browser
        run: python scripts/ci/run_browser.py --work "$RUNNER_TEMP/atlas-c1-browser"
      - name: Regress precision, repeated metrics and untrusted labels
        if: ${{ !cancelled() }}
        run: python scripts/ci/run_browser.py --work "$RUNNER_TEMP/atlas-c1-browser" --adversarial
      - name: Verify related references, source identity, keyboard and legacy CSS zoom
        if: ${{ !cancelled() }}
        run: python scripts/ci/run_browser.py --work "$RUNNER_TEMP/atlas-c1-browser" --related-references
      - name: Exercise P02 C0 from the installed consumer outside the checkout
        if: ${{ !cancelled() }}
        run: |
          "$RUNNER_TEMP/atlas-c1-browser/viewer-env/bin/python" -I scripts/qa/atlas_parity02_p02_run_browser.py --repo "$GITHUB_WORKSPACE" --report "$RUNNER_TEMP/atlas-c1-browser/p02/browser-report.json" --screenshots "$RUNNER_TEMP/atlas-c1-browser/p02/screenshots" --code-sha "$(git rev-parse HEAD)" --require-fonts
      - name: Preserve synthetic browser evidence for the tested candidate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas003-browser-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/atlas-c1-browser/browser*.json
            ${{ runner.temp }}/atlas-c1-browser/browser*.png
            ${{ runner.temp }}/atlas-c1-browser/clean-install-report.json
            ${{ runner.temp }}/atlas-c1-browser/p02/**/*.json
            ${{ runner.temp }}/atlas-c1-browser/p02/screenshots/*.png
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  reference:
    name: Public standards comparison and RO-Crate 1.3 reference
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned reference tooling
        run: |
          python -m pip install setuptools==80.9.0 wheel==0.45.1 jsonschema==4.25.1 roc-validator==0.13.0
          python -m pip install --no-build-isolation ./packages/protocol
      - name: Compare public candidates
        run: python research/compare_candidates.py .ci-compare
      - name: Verify declared RO-Crate reference scope
        run: |
          python research/validate_reference.py examples/environmental/sample .ci-reference/environmental.json --cache .ci-cache --warm-cache
          python research/validate_reference.py .ci-compare/eln-1.2 .ci-reference/eln.json --cache .ci-cache --profile ro-crate-1.2 --warm-cache
          python research/validate_reference.py examples/upstream/process-run-0.6 .ci-reference/official-example.json --cache .ci-cache --expect invalid
