name: Atlas native notebook integration
on:
  pull_request:
    paths:
      - 'specs/004-native-notebook-experience/**'
      - 'tools/export_native_notebook.py'
      - 'packages/atlas/src/atlas_viewer/**'
      - 'tests/viewer/test_native_notebook*.py'
      - 'scripts/ABRIR-ATLAS-NATIVO.ps1'
      - 'scripts/ABRIR-ATLAS.ps1'
      - 'scripts/atlas_launch.py'
      - 'scripts/ci/run_native_notebook_browser.py'
      - 'scripts/qa/browser_native_notebook.mjs'
      - 'scripts/qa/browser_p02_notebook.mjs'
      - 'scripts/qa/run_p02_notebook_browser.py'
      - 'scripts/qa/browser_p01_lineage.mjs'
      - 'scripts/ci/run_p01_lineage_browser.py'
      - 'scripts/qa/test_native_navigation.mjs'
      - '.github/workflows/atlas-native-notebook.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        optimize: ['0', '1']
    env:
      PYTHONOPTIMIZE: ${{ matrix.optimize }}
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      SPECIFY_FEATURE_DIRECTORY: specs/004-native-notebook-experience
      SPECIFY_FEATURE_NO_PERSIST: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install existing public packages
        run: |
          python -m pip install setuptools==80.9.0 wheel==0.45.1
          python -m pip install --no-build-isolation ./packages/protocol ./packages/atlas
      - name: Execute repository Spec Kit planning and task tools
        run: |
          python .specify/scripts/python/setup_plan.py --json
          python .specify/scripts/python/setup_tasks.py --json
          python .specify/scripts/python/check_prerequisites.py --json --require-spec --require-tasks --include-tasks
          git diff --exit-code -- .specify specs/004-native-notebook-experience
      - name: Test actual exporter SDK native reader and HTTP
        run: python -m unittest discover -s tests/viewer -p 'test_native_notebook*.py' -v
      - name: Validate both launchers and standalone Atlas CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($entry in @('scripts/ABRIR-ATLAS.ps1', 'scripts/ABRIR-ATLAS-NATIVO.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $entry), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
          python -I -m atlas_viewer serve --help
          if ($LASTEXITCODE -ne 0) { throw 'Standalone Atlas entrypoint failed' }
          $powershell51 = Get-Command powershell.exe -ErrorAction SilentlyContinue
          if ($powershell51) {
            & $powershell51.Source -NoProfile -ExecutionPolicy Bypass -File (Join-Path $PWD 'scripts/ABRIR-ATLAS.ps1') -Port 18754 -NoOpen -ProbeOnly
            if ($LASTEXITCODE -ne 0) { throw 'PowerShell 5.1 launcher smoke failed' }
          }
      - name: Exact tested SHA
        run: git rev-parse HEAD
  browser-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install public packages and existing pinned browser tools
        run: |
          python -m pip install setuptools==80.9.0 wheel==0.45.1
          python -m pip install --no-build-isolation ./packages/protocol ./packages/atlas
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Parse native modules and exercise installed product
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUTF8: '1'
        run: |
          node --check packages/atlas/src/atlas_viewer/static/native_notebook.js
          node --check packages/atlas/src/atlas_viewer/static/native_graph.js
          node --check packages/atlas/src/atlas_viewer/static/native_navigation.js
          node --check packages/atlas/src/atlas_viewer/static/native_lineage.js
          node scripts/qa/test_native_navigation.mjs
          python scripts/ci/run_native_notebook_browser.py --work .ci-native
          python scripts/qa/run_p02_notebook_browser.py --work .ci-native/p02
          python scripts/ci/run_p01_lineage_browser.py --work .ci-native/p01
      - name: Preserve native browser evidence (no private corpus)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-native-notebook-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .ci-native/browser-native*.json
            .ci-native/browser-native*.png
            .ci-native/p02/browser-p02*.json
            .ci-native/p02/browser-p02*.png
            .ci-native/p01/browser-p01*.json
            .ci-native/p01/browser-p01*.png
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
