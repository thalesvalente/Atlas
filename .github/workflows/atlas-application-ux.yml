name: Atlas application UX
on:
  pull_request:
    paths:
      - 'specs/004-native-notebook-experience/**'
      - 'packages/atlas/src/atlas_viewer/**'
      - 'scripts/qa/*application_ux*'
      - 'scripts/qa/test_native_legacy.mjs'
      - '.github/workflows/atlas-application-ux.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  application-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install wheels and existing pinned browser tools
        run: |
          python -m pip install setuptools==80.9.0 wheel==0.45.1
          python -m pip install --no-build-isolation ./packages/protocol ./packages/atlas
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Qualify exact installed application assets and complete UX
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONUTF8: '1'
        run: |
          git rev-parse HEAD
          node --check packages/atlas/src/atlas_viewer/static/native_notebook.js
          node --check scripts/qa/browser_application_ux.mjs
          node scripts/qa/test_native_legacy.mjs
          python scripts/qa/run_application_ux_browser.py --work .ci-application-ux --require-graph-cancel
      - name: Preserve synthetic application evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-application-ux-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .ci-application-ux/browser-application*.json
            .ci-application-ux/browser-application*.png
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
