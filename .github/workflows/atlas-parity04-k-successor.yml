name: ATLAS AP04 C4 K successor

on:
  push:
    branches: [ci/atlas-ap04-c4-k-successor-20261104]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-source:
    name: K exact source / ${{ matrix.os }} / optimize=${{ matrix.optimize }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        optimize: ['0', '1']
    env:
      PYTHONUTF8: '1'
      PYTHONOPTIMIZE: ${{ matrix.optimize }}
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Exercise synthetic attacks without executing any K document
        run: python tests/qa/test_atlas_parity04_k_doc_ci.py --output "${{ runner.temp }}/c4-k-evidence/REGRESSIONS.json" --junit "${{ runner.temp }}/c4-k-evidence/regressions.xml"
      - name: Verify exact K objects and original F2 on its own immutable epoch
        run: python scripts/qa/atlas_parity04_k_doc_ci.py audit --output "${{ runner.temp }}/c4-k-evidence/SOURCE.json" --junit "${{ runner.temp }}/c4-k-evidence/source.xml"
      - name: Bind the current consumer PR and materialize its exact source
        shell: bash
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, subprocess, urllib.request
          policy = json.loads(pathlib.Path('docs/missions/atlas-parity-04/f4-c4-k-successor/SOURCE-POLICY.json').read_text(encoding='utf-8'))
          req = urllib.request.Request('https://api.github.com/repos/thalesvalente/Atlas/pulls/21', headers={'Authorization': 'Bearer ' + os.environ['GH_READ_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(req, timeout=30) as response:
              pr = json.load(response)
          if pr['head']['sha'] != policy['source_sha'] or pr['base']['sha'] != policy['baseline']['sha']:
              raise SystemExit('SOURCE_HEAD_OR_BASE_DRIFT: version a new exact C4 policy; do not reuse this result')
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'c4-k-evidence'
          (out/'PR-SNAPSHOT.json').write_text(json.dumps({'pr': 21, 'head_sha': pr['head']['sha'], 'base_sha': pr['base']['sha'], 'draft': pr['draft'], 'updated_at': pr['updated_at']}, indent=2)+'\n', encoding='utf-8')
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'atlas-k-source'
          subprocess.run(['git', 'worktree', 'add', '--detach', str(target), policy['source_sha']], check=True)
          PY
      - name: Supply existing pinned build tools in the ephemeral runner
        run: python -m pip install build==1.3.0 setuptools==80.9.0 wheel==0.45.1
      - name: Build unchanged packages into isolated consumers outside the K checkout
        run: python "${{ runner.temp }}/atlas-k-source/scripts/qa/clean_install.py" --repo "${{ runner.temp }}/atlas-k-source" --work "${{ runner.temp }}/atlas-k-installed"
      - name: Execute the unchanged C4 installed suite against the K SHA
        run: python "${{ runner.temp }}/atlas-k-source/scripts/qa/atlas_parity03_c4_ci.py" installed --repo "${{ runner.temp }}/atlas-k-source" --work "${{ runner.temp }}/atlas-k-installed"
      - name: Require exact identity, all inherited tests and zero skips
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          out = root/'c4-k-evidence'
          source = json.loads((out/'SOURCE.json').read_text(encoding='utf-8'))
          tests = json.loads((out/'REGRESSIONS.json').read_text(encoding='utf-8'))
          installed = json.loads((root/'atlas-k-installed/c4-installed-receipt.json').read_text(encoding='utf-8'))
          head = subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()
          mode = int(os.environ['PYTHONOPTIMIZE'])
          full = installed.get('full_installed_suite', {})
          checks = [source['status']=='PASS', tests['status']=='PASS', installed['status']=='PASS',
                    source['harness']['sha']==head==tests['harness_sha'], tests['worktree_clean'],
                    installed['tested_sha']==source['source_sha'], installed['tested_tree']==source['source_tree'],
                    tests['optimization']==mode==source['optimization']==installed['optimization'],
                    tests['tests_run']==len(set(tests['test_ids']))==44,
                    tests['failures']==tests['errors']==tests['skips']==0, tests['loader_errors']==[],
                    installed['unique_test_cases']==full['total_executed']==len(set(full['test_ids']))==223,
                    full['r4_absent'], full['consumer_outside_checkout'],
                    all(s['failures']==s['errors']==s['skipped']==0 and not s['loader_errors'] for s in full['suites'])]
          if not all(checks):
              raise SystemExit('C4_K_RECEIPT_IDENTITY_OR_COLLECTION_FAILURE: '+repr(checks))
          result = {'status':'C4_K_SOURCE_CI_PASS_NOT_COMPOSITION_ACCEPTANCE',
                    'harness_sha':head,'harness_tree':source['harness']['tree'],
                    'source_sha':source['source_sha'],'source_tree':source['source_tree'],
                    'optimization':mode,'runner_os':os.environ['RUNNER_OS'],
                    'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],
                    'new_regression_ids':44,'inherited_installed_ids':223,'skips':0,
                    'historical_f2_sha':source['historical_f2']['tested_sha'],
                    'consumer_workflows_requalified':False,'architectural_approval':False,
                    'descriptor_0_2_1_implementation_authorized':False}
          (out/'QUALIFICATION.json').write_text(json.dumps(result,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result))
          PY
      - name: Preserve exact harness and source evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-c4-k-${{ matrix.os }}-O${{ matrix.optimize }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/c4-k-evidence/**
            ${{ runner.temp }}/atlas-k-installed/clean-install-report.json
            ${{ runner.temp }}/atlas-k-installed/parity02-p06-installed-checks.json
            ${{ runner.temp }}/atlas-k-installed/parity02-p06-installed-checks.log
            ${{ runner.temp }}/atlas-k-installed/c4-installed-receipt.json
            ${{ runner.temp }}/atlas-k-installed/c4-installed-junit.xml
          if-no-files-found: error
          retention-days: 14
