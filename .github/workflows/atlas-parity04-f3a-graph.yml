name: ATLAS-PARITY-04 F3A isolated graph

on:
  push:
    branches: [feat/atlas-parity04-f3a-graph-20261031]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'packages/atlas/src/atlas_viewer/static/parity04_f3a_graph.*'
      - 'tests/qa/test_atlas_parity04_f3a_graph.py'
      - 'tests/fixtures/atlas_parity04_f3a_*'
      - 'scripts/qa/atlas_parity04_f3a_*'
      - 'docs/missions/atlas-parity-04/f3a-graph/**'
      - '.github/workflows/atlas-parity04-f3a-graph.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-browser:
    name: F3A Chromium / ${{ matrix.os }} / optimize=${{ matrix.optimize }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        optimize: ['0', '1']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONOPTIMIZE: ${{ matrix.optimize }}
      F3A_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Checkout exact candidate, not synthetic merge ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install pinned independent schema and browser tooling
        run: |
          python -m pip install jsonschema==4.25.1
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Run all isolated source, browser and custody oracles without skips
        env:
          F3A_OUTPUT: ${{ runner.temp }}/atlas-parity04-f3a
        run: python scripts/qa/atlas_parity04_f3a_ci.py
      - name: Preserve exact-SHA JSON, JUnit, logs and synthetic PNG evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-f3a-graph-${{ matrix.os }}-O${{ matrix.optimize }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/atlas-parity04-f3a/**
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
