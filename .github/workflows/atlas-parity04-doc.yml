name: ATLAS-PARITY-04 documentation successor

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  successor-guard:
    name: AP04 documentation guard / ${{ matrix.os }} / optimize=${{ matrix.optimize }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        optimize: ['0', '1']
    env:
      PYTHONOPTIMIZE: ${{ matrix.optimize }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Record the exact candidate
        run: |
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
      - name: Verify the exact C4 documentation successor and supplemental overlay
        shell: bash
        run: |
          if git merge-base --is-ancestor 04373bb910db2e6215cc8bc4212093b649e48456 HEAD; then
            python scripts/qa/atlas_parity04_f2_doc_ci.py audit --output .test-output/atlas-parity04/SUCCESSOR-DOC-RECEIPT.json --junit .test-output/atlas-parity04/successor-doc-junit.xml
          else
            ap04_ancestry_status=$?
            if [ "$ap04_ancestry_status" -ne 1 ]; then
              exit "$ap04_ancestry_status"
            fi
            python scripts/qa/atlas_parity04_doc_ci.py audit --output .test-output/atlas-parity04/SUCCESSOR-DOC-RECEIPT.json --junit .test-output/atlas-parity04/successor-doc-junit.xml
          fi
      - name: Execute negative counterexamples in a temporary Git repository
        shell: bash
        run: |
          python -m unittest discover -s tests/qa -p 'test_atlas_parity04_doc_ci.py' -v
          python tests/qa/test_atlas_parity04_f2_doc_ci.py --output .test-output/atlas-parity04-f2/REGRESSIONS.json --junit .test-output/atlas-parity04-f2/regressions.xml
      - name: Preserve exact-SHA AP04 guard evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atlas-parity04-doc-${{ matrix.os }}-O${{ matrix.optimize }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            .test-output/atlas-parity04/**
            .test-output/atlas-parity04-f2/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
